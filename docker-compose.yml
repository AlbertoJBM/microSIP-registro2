version: '3.8'

services:
  central-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./server/data:/app/data
    restart: always

  dashboard:
    build: ./dashboard
    ports:
      - "8080:80"
    depends_on:
      - central-server
    restart: always